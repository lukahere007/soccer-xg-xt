[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalvalue"
version = "0.1.0"
description = "Expected goals from shot geometry and expected threat from passes, on StatsBomb open data"
authors = [{ name = "Luke Wamalwa" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
